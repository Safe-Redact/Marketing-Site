backend:
  name: github
  use_graphql: true

publish_mode: editorial_workflow
show_preview_links: false
media_folder: public/images/blog
public_folder: /images/blog

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: articles
    label: Blog articles
    label_singular: Blog article
    description: Draft, review, and publish factual OpenRedakt articles and company updates.
    folder: content/blog
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{publication}} — {{date}}"
    editor:
      preview: true
    # decap-cms@3.17.1 validates sortable_fields as an array whose items are either a
    # field name or {field, label, default_sort}. The {fields, default} object form is
    # rejected by its schema, which stops the CMS before the login screen renders.
    sortable_fields:
      - field: date
        default_sort: desc
      - title
      - status
      - category
    view_filters:
      - label: Blog articles
        field: type
        pattern: article
      - label: Guides
        field: type
        pattern: guide
      - label: Company news
        field: type
        pattern: news
      - label: Product updates
        field: type
        pattern: product-update
      - label: Publish with release
        field: publication
        pattern: immediate
      - label: Scheduled
        field: publication
        pattern: scheduled
      - label: Archived
        field: publication
        pattern: archived
    fields:
      - label: Title
        name: title
        widget: string
        pattern: ['^.{5,120}$', "Use between 5 and 120 characters."]
      - label: Slug
        name: slug
        widget: string
        hint: Lowercase letters, numbers, and single hyphens only. Changing a published slug requires a redirect review.
        pattern: ['^(?=.{3,100}$)[a-z0-9]+(?:-[a-z0-9]+)*$', "Use 3 to 100 lowercase letters, numbers, and single hyphens."]
      - label: Excerpt
        name: excerpt
        widget: text
        pattern: ['^.{40,240}$', "Use between 40 and 240 characters."]
      - label: Author
        name: author
        widget: string
        hint: Use an approved OpenRedakt staff byline. Do not invent biographies or contributors.
      - label: Content type
        name: type
        widget: select
        default: article
        hint: All four kinds publish to the Insights hub at /blog, where readers filter
          by content type. Pick the one that describes the entry.
        options:
          - label: Blog article
            value: article
          - label: Educational guide
            value: guide
          - label: Company news
            value: news
          - label: Product update
            value: product-update
      - label: Category
        name: category
        widget: string
        hint: Reuse an approved category name consistently.
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        max: 6
        hint: Up to six short topic tags. Reuse existing spellings; tags that differ
          only by case are merged.
        field:
          label: Tag
          name: tag
          widget: string
          pattern:
            - ^(?=.*[A-Za-z0-9]).{2,30}$
            - Use 2 to 30 characters including at least one letter or digit.
      - label: Publication time (UTC)
        name: date
        widget: datetime
        default: "{{now}}"
        picker_utc: true
        hint: Immediate entries go live with the release. Scheduled entries remain hidden until this UTC time.
      - label: Updated date
        name: updatedDate
        widget: datetime
        required: false
        default: ""
        picker_utc: true
      - label: Featured image
        name: featuredImage
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 5242880
      - label: Featured image alt text
        name: imageAlt
        widget: string
        required: false
        hint: Required when a featured image is selected. Describe its relevant information, not its appearance alone.
      - label: Post-merge visibility
        name: publication
        widget: select
        default: immediate
        hint: Draft, review, and approval are controlled by the editorial workflow. This field controls visibility only after the pull request is merged and released.
        options:
          - { label: Publish with the approved release, value: immediate }
          - { label: Schedule for the UTC publication time, value: scheduled }
          - { label: Archive after the approved release, value: archived }
      - label: Featured article
        name: featured
        widget: boolean
        default: false
      - label: SEO description
        name: seoDescription
        widget: text
        pattern: ['^.{50,170}$', "Use between 50 and 170 characters."]
      - label: Article content
        name: body
        widget: markdown
        hint: Use Markdown only. Raw HTML, executable content, download links, and unsupported claims are not permitted.
